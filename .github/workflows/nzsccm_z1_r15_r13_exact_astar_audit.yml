name: NZSCCM Z1 R15 R13 exact algebra audits

on:
  push:
    paths:
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_ASTAR_EXACT_AUDIT.py'
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_TARGET_PERIOD_EXACT_AUDIT.py'
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_TOWER_AUDIT.py'
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER.py'
      - '.github/workflows/nzsccm_z1_r15_r13_exact_astar_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-algebra-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic backend
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Reconstruct R13 Astar and audit Z1 support exactly
        run: python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_ASTAR_EXACT_AUDIT.py > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_ASTAR_EXACT_AUDIT_REPORT.json
      - name: Reconstruct exact target-period residue data
        run: python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_TARGET_PERIOD_EXACT_AUDIT.py > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_TARGET_PERIOD_EXACT_AUDIT_REPORT.json
      - name: Reduce 112-equation circuit to exact seven-radical tower
        run: python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_TOWER_AUDIT.py > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_TOWER_AUDIT_REPORT.json
      - name: Compile explicit exact seven-radical formulas
        run: |
          set +e
          python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER.py > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER_REPORT.json 2> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER_ERROR.txt
          RC=$?
          echo "COMPILER_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER_ERROR.txt
          cat semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER_ERROR.txt
          exit 0
      - name: Commit exact audit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_*_REPORT.json semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SEVEN_RADICAL_FORMULA_COMPILER_ERROR.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact Z1 R15 R13 radical formula compilation'
            git push
          fi
