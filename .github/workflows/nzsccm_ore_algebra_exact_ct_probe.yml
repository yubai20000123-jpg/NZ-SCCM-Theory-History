name: NZSCCM exact algebraic creative telescoping probe

on:
  push:
    paths:
      - '.github/workflows/nzsccm_ore_algebra_exact_ct_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-ct-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ore_algebra with PassageMath backend
        run: |
          python -m pip install --disable-pip-version-check 'ore_algebra[passagemath] @ git+https://github.com/mkauers/ore_algebra.git'
      - name: Exact creative telescoping and nested algebraic annihilator probes
        run: |
          cat > /tmp/nzsccm_ct_probe.py <<'PY'
          from sage.all import QQ, ZZ, PolynomialRing
          from ore_algebra import OreAlgebra
          print('NZSCCM_ORE_ALGEBRA_CT_PROBE_START')
          # 1) exact multivariate creative telescoping of an algebraic kernel
          R=ZZ['x','t']; F=R.fraction_field()
          A=OreAlgebra(F, ('Dx','Dt')); Dx,Dt=A.gens(); x,t=R.gens()
          Q=1-t*x*(1-x)
          Ix=2*Q*Dx+Q.derivative(x)
          It=2*Q*Dt+Q.derivative(t)
          ans=A.ideal([Ix,It]).ct(Dx)
          print('CT=',ans)
          print('NZSCCM_ORE_ALGEBRA_CT_PASS')
          # 2) exact annihilator_of_composition on a genuine nested quadratic tower
          Rx=PolynomialRing(QQ,'x'); x=Rx.gen(); Fx=Rx.fraction_field()
          P1=PolynomialRing(Fx,'y'); y0=P1.gen(); K1=Fx.extension(y0^2-(x+1), names=('y',)); y=K1.gen()
          P2=PolynomialRing(K1,'z'); z0=P2.gen(); K2=K1.extension(z0^2-(y+x), names=('z',)); z=K2.gen()
          B=OreAlgebra(Rx,'Dx'); Dx=B.gen()
          L=(x*Dx-1).annihilator_of_composition(z+y)
          print('NESTED_TOWER_ANN=',L)
          print('NESTED_TOWER_ORDER=',L.order())
          print('NZSCCM_ORE_ALGEBRA_NESTED_TOWER_PASS')
          PY
          set +e
          timeout 900 python /tmp/nzsccm_ct_probe.py > semantic_v2/40_execution/combined/20260819__NZSCCM__ORE_ALGEBRA_PASSAGEMATH_CT_PROBE.txt 2>&1
          RC=$?
          echo "ORE_PROBE_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__ORE_ALGEBRA_PASSAGEMATH_CT_PROBE.txt
          cat semantic_v2/40_execution/combined/20260819__NZSCCM__ORE_ALGEBRA_PASSAGEMATH_CT_PROBE.txt
          exit 0
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__ORE_ALGEBRA_PASSAGEMATH_CT_PROBE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact ore_algebra creative telescoping probe'
            git push
          fi
