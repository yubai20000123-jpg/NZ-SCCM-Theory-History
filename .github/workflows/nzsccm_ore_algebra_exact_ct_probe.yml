name: NZSCCM exact algebraic creative telescoping probe

on:
  push:
    paths:
      - '.github/workflows/nzsccm_ore_algebra_exact_ct_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-ct-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ore_algebra with PassageMath backend
        run: |
          python -m pip install --disable-pip-version-check 'ore_algebra[passagemath] @ git+https://github.com/mkauers/ore_algebra.git'
      - name: Exact creative telescoping of an algebraic elliptic kernel
        run: |
          cat > /tmp/nzsccm_ct_probe.py <<'PY'
          from sage.all import ZZ
          from ore_algebra import OreAlgebra
          R=ZZ['x','t']
          F=R.fraction_field()
          A=OreAlgebra(F, ('Dx','Dt'))
          Dx,Dt=A.gens()
          x,t=R.gens()
          Q=1-t*x*(1-x)
          # f=Q^(-1/2): 2 Q d_v f + (d_v Q) f = 0 exactly.
          Ix=2*Q*Dx+Q.derivative(x)
          It=2*Q*Dt+Q.derivative(t)
          I=A.ideal([Ix,It])
          ans=I.ct(Dx)
          print('NZSCCM_ORE_ALGEBRA_CT_PROBE_START')
          print('ANN_X=',Ix)
          print('ANN_T=',It)
          print('CT=',ans)
          print('NZSCCM_ORE_ALGEBRA_CT_PROBE_PASS')
          PY
          python /tmp/nzsccm_ct_probe.py 2>&1 | tee semantic_v2/40_execution/combined/20260819__NZSCCM__ORE_ALGEBRA_PASSAGEMATH_CT_PROBE.txt
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__ORE_ALGEBRA_PASSAGEMATH_CT_PROBE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact ore_algebra creative telescoping probe'
            git push
          fi
