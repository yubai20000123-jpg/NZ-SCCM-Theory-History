name: NZSCCM exact half-power annihilator

on:
  push:
    paths:
      - '.github/workflows/nzsccm_openxm_sm1_halfpower_ann_exact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  halfpower-ann:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenXM
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y wget ca-certificates >/dev/null
          sudo wget -q -O /etc/apt/sources.list.d/fe-deb2.list https://www.math.kobe-u.ac.jp/deb2/fe-deb2.list
          sudo wget -q -O /usr/share/keyrings/fe-deb2-archive-keyring.gpg https://www.math.kobe-u.ac.jp/deb2/fe-deb2-archive-keyring.gpg
          sudo apt-get update >/dev/null
          touch /tmp/i-agree-with-asir-license
          sudo -E apt-get install -y openxm >/dev/null
      - name: Compute exact annihilator of A^(-1/2)
        run: |
          cat > /tmp/halfpower.rr <<'EOF'
          load("sm1.rr")$
          A=r*(1-r)*v*(1-v)$
          print("START_GENERIC_ANN")$
          G=sm1.genericAnn([A,[ss,r,v]])$
          print(G)$
          print("START_SUBST")$
          H=map(subst,G,ss,-1/2)$
          print(H)$
          print("EXPECTED")$
          print([(-2*r^2+2*r)*dr-2*r+1,(-2*v^2+2*v)*dv-2*v+1])$
          print("END_HALFPOWER")$
          end$
          EOF
          set +e
          asir -quiet -f /tmp/halfpower.rr > semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_HALFPOWER_ANN_EXACT.txt 2>&1
          echo "ASIR_EXIT_CODE=$?" >> semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_HALFPOWER_ANN_EXACT.txt
          exit 0
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_HALFPOWER_ANN_EXACT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact half-power branch annihilator probe'
            git push
          fi
