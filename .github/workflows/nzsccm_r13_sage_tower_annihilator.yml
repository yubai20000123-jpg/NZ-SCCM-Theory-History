name: NZSCCM full R13 exact Sage tower annihilator

on:
  push:
    paths:
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR.py'
      - '.github/workflows/nzsccm_r13_sage_tower_annihilator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-annihilator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mature algebraic Ore backend
        run: python -m pip install --disable-pip-version-check 'ore_algebra[passagemath] @ git+https://github.com/mkauers/ore_algebra.git'
      - name: Build full R13 nested field and exact r-annihilator
        run: |
          set +e
          timeout 1200 python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR.py > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR_REPORT.json 2> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR_ERROR.txt
          RC=$?
          echo "SAGE_TOWER_ANNIHILATOR_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR_ERROR.txt
          cat semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR_ERROR.txt
          exit 0
      - name: Commit constructor result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR_*.txt semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R15_R13_SAGE_TOWER_ANNIHILATOR_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact full R13 Sage tower annihilator result'
            git push
          fi
