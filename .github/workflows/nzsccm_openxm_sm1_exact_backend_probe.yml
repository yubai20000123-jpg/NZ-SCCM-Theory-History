name: NZSCCM OpenXM sm1 exact backend probe

on:
  push:
    paths:
      - '.github/workflows/nzsccm_openxm_sm1_exact_backend_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  openxm-sm1-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenXM from official Kobe Debian repository
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          sudo wget -q -O /etc/apt/sources.list.d/fe-deb2.list https://www.math.kobe-u.ac.jp/deb2/fe-deb2.list
          sudo wget -q -O /usr/share/keyrings/fe-deb2-archive-keyring.gpg https://www.math.kobe-u.ac.jp/deb2/fe-deb2-archive-keyring.gpg
          sudo apt-get update
          touch /tmp/i-agree-with-asir-license
          sudo -E apt-get install -y openxm
          rm -f /tmp/i-agree-with-asir-license
      - name: Locate exact backend
        run: |
          {
            echo '=== COMMANDS ==='
            command -v asir || true
            find /usr/local/OpenXM -type f \( -name asir -o -name ox_sm1 -o -name ox_sm1_forAsir \) 2>/dev/null | head -30 || true
          } | tee /tmp/openxm_locations.txt
      - name: Run exact GKZ/D-module smoke test
        run: |
          ASIR="$(command -v asir || true)"
          if [ -z "$ASIR" ]; then
            ASIR="$(find /usr/local/OpenXM -type f -name asir 2>/dev/null | head -1)"
          fi
          test -n "$ASIR"
          cat > /tmp/nzsccm_sm1_probe.rr <<'EOF'
          load("sm1.rr")$
          print("NZSCCM_OPENXM_SM1_PROBE_START")$
          G=sm1.gkz([[[1,1,1,1],[0,1,3,4]],[0,2]])$
          print(G)$
          print("NZSCCM_OPENXM_SM1_GKZ_PASS")$
          print(sm1.integration([dt-(3*t^2-x),dx+t],[t,x],[t]))$
          print("NZSCCM_OPENXM_SM1_INTEGRATION_PASS")$
          end$
          EOF
          {
            echo "ASIR=$ASIR"
            "$ASIR" -quiet -f /tmp/nzsccm_sm1_probe.rr
          } 2>&1 | tee semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_EXACT_BACKEND_PROBE.txt
      - name: Commit probe report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_EXACT_BACKEND_PROBE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record OpenXM sm1 exact backend probe'
            git push
          fi
