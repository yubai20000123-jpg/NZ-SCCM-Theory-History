name: NZSCCM exact Oaku semialgebraic Heaviside probe
on:
  push:
    paths:
      - '.github/workflows/nzsccm_oaku_semialgebraic_exact_probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official OpenXM
        env: {DEBIAN_FRONTEND: noninteractive}
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          sudo wget -q -O /etc/apt/sources.list.d/fe-deb2.list https://www.math.kobe-u.ac.jp/deb2/fe-deb2.list
          sudo wget -q -O /usr/share/keyrings/fe-deb2-archive-keyring.gpg https://www.math.kobe-u.ac.jp/deb2/fe-deb2-archive-keyring.gpg
          sudo apt-get update
          touch /tmp/i-agree-with-asir-license
          sudo -E apt-get install -y openxm
          rm -f /tmp/i-agree-with-asir-license
      - name: Run exact polynomial-inequality plus bounded-box D-module integration
        run: |
          cat > /tmp/nzsccm_oaku_probe.rr <<'EOF'
          import("nn_ndbf.rr")$
          import("nk_restriction.rr")$
          print("NZSCCM_OAKU_SEMIALGEBRAIC_PROBE_START")$
          /* analytic factor phi=(1+x^2+t^2)^(-1/2) */
          F=1+x^2+t^2$
          IA=ndbf.ann_fa(F,-1/2)$
          print("ANALYTIC_ANN")$ print(IA)$
          /* internal polynomial inequality x-t >= 0: H(x-t)=(x-t)_+^0 */
          IH=ndbf.ann_n([x-t])$
          IH0=map(subst,IH,s0,0)$
          print("HEAVISIDE_ANN")$ print(IH0)$
          /* exact product annihilator */
          IP=nk_restriction.ann_mul(IA,IH0,[x,t],[dx,dt])$
          print("PRODUCT_ANN")$ print(IP)$
          /* exact bounded x integral over [-1,1], leaving t as parameter */
          J=nk_restriction.ost_integration_ideal(IP,[x,t],[dx,dt],[1,0],[-1],[1])$
          print("BOUNDED_SEMIALGEBRAIC_INTEGRAL_IDEAL")$ print(J)$
          print("NZSCCM_OAKU_SEMIALGEBRAIC_PROBE_PASS")$
          end$
          EOF
          mkdir -p semantic_v2/40_execution/combined
          set +e
          timeout 900 asir -quiet -f /tmp/nzsccm_oaku_probe.rr > semantic_v2/40_execution/combined/20260819__NZSCCM__OAKU_SEMIALGEBRAIC_EXACT_PROBE.txt 2>&1
          RC=$?
          echo "OAKU_PROBE_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__OAKU_SEMIALGEBRAIC_EXACT_PROBE.txt
          cat semantic_v2/40_execution/combined/20260819__NZSCCM__OAKU_SEMIALGEBRAIC_EXACT_PROBE.txt
          exit 0
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__OAKU_SEMIALGEBRAIC_EXACT_PROBE.txt
          if ! git diff --cached --quiet; then git commit -m 'Record exact Oaku semialgebraic integration probe'; git push; fi
