name: NZSCCM exact SM1 geometry residue and algebraic branch

on:
  push:
    paths:
      - '.github/workflows/nzsccm_openxm_sm1_geometry_residue_exact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-geometry-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official OpenXM backend
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          sudo wget -q -O /etc/apt/sources.list.d/fe-deb2.list https://www.math.kobe-u.ac.jp/deb2/fe-deb2.list
          sudo wget -q -O /usr/share/keyrings/fe-deb2-archive-keyring.gpg https://www.math.kobe-u.ac.jp/deb2/fe-deb2-archive-keyring.gpg
          sudo apt-get update
          touch /tmp/i-agree-with-asir-license
          sudo -E apt-get install -y openxm
          rm -f /tmp/i-agree-with-asir-license
      - name: Exact residue-cycle audit and direct algebraic-branch D-module
        run: |
          cat > /tmp/nzsccm_geometry_residue.rr <<'EOF'
          load("sm1.rr")$
          print("NZSCCM_GEOMETRY_RESIDUE_START")$
          A=r*(1-r)*v*(1-v)$
          F=w^2-A$
          G=[F*dw+diff(F,w),F*dr+diff(F,r),F*dv+diff(F,v)]$
          print("NAIVE_DIRECT_IMAGE_OF_1_OVER_F")$
          print(sm1.integration(G,[w,r,v],[w]))$
          print("EXPECTED_SELECTED_POSITIVE_RESIDUE_BRANCH")$
          print([2*r*(1-r)*dr+(1-2*r),2*v*(1-v)*dv+(1-2*v)])$
          print("GENERIC_ANN_A_POW_SS")$
          GA=sm1.genericAnn([A,[ss,r,v]])$
          print(GA)$
          GHalf=map(subst,GA,ss,-1/2)$
          print("SPECIALIZE_SS_MINUS_ONE_HALF")$
          print(GHalf)$
          print("NZSCCM_GEOMETRY_RESIDUE_END")$
          end$
          EOF
          mkdir -p semantic_v2/40_execution/combined
          set +e
          asir -quiet -f /tmp/nzsccm_geometry_residue.rr > semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_GEOMETRY_RESIDUE_EXACT.txt 2>&1
          RC=$?
          echo "ASIR_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_GEOMETRY_RESIDUE_EXACT.txt
          cat semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_GEOMETRY_RESIDUE_EXACT.txt
          exit 0
      - name: Commit exact report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__OPENXM_SM1_GEOMETRY_RESIDUE_EXACT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact SM1 geometry branch audit'
            git push
          fi
