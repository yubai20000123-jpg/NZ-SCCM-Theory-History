name: NZSCCM Z1 R17 exact smooth spectral branch annihilator
on:
  push:
    paths:
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.py'
      - '.github/workflows/nzsccm_z1_r17_spectral_branch_annihilator.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  annihilator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Initialize durable diagnostic log
        run: |
          mkdir -p semantic_v2/40_execution/combined
          {
            echo 'NZSCCM_R17_BRANCH_ANNIHILATOR_RESUME_START'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_REF=$GITHUB_REF"
            python --version
          } > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
      - name: Install native exact-arithmetic build headers
        id: native
        continue-on-error: true
        env: {DEBIAN_FRONTEND: noninteractive}
        run: |
          set +e
          {
            sudo apt-get update
            sudo apt-get install -y build-essential libgmp-dev libmpfr-dev libmpfi-dev libflint-dev
          } >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt 2>&1
          RC=$?
          echo "R17_NATIVE_DEPS_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          exit $RC
      - name: Install PassageMath ore_algebra
        id: install
        if: always()
        continue-on-error: true
        run: |
          set +e
          python -m pip install --disable-pip-version-check 'ore_algebra[passagemath] @ git+https://github.com/mkauers/ore_algebra.git' >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt 2>&1
          RC=$?
          echo "R17_ORE_INSTALL_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          exit $RC
      - name: Build exact branch annihilator
        if: always()
        run: |
          set +e
          timeout 1200 python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.py >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt 2>&1
          RC=$?
          echo "R17_BRANCH_ANNIHILATOR_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          tail -140 semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          exit 0
      - name: Commit result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record resumed exact R17 smooth spectral branch annihilator'
            git push
          fi