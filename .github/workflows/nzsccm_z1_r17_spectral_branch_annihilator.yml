name: NZSCCM Z1 R17 exact smooth spectral branch annihilator
on:
  push:
    paths:
      - 'semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  annihilator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Initialize durable diagnostic log
        run: |
          mkdir -p semantic_v2/40_execution/combined
          {
            echo 'NZSCCM_R17_BRANCH_ANNIHILATOR_RESUME_START'
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "GITHUB_REF=$GITHUB_REF"
            python --version
          } > semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
      - name: Install PassageMath standard library
        id: sage
        continue-on-error: true
        run: |
          set +e
          python -m pip install --disable-pip-version-check passagemath-standard >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt 2>&1
          RC=$?
          echo "R17_PASSAGEMATH_STANDARD_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          exit $RC
      - name: Install symbolic-only ore_algebra
        id: ore
        if: always()
        continue-on-error: true
        run: |
          set +e
          {
            rm -rf /tmp/ore_algebra
            git clone --filter=blob:none https://github.com/mkauers/ore_algebra.git /tmp/ore_algebra
            cd /tmp/ore_algebra
            git checkout 18680180c884fac869a064db99f29a221aad9dfe
            python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ore_algebra/setup.py')
          s=p.read_text()
          a=s.index('if list(map(int, sage.version.version.split')
          b=s.index('\nsetup(',a)
          s=s[:a]+'# NZ-SCCM symbolic-only install: exact OreAlgebra core is required; numerical analytic C extensions are not.\nextensions = []\n'+s[b:]
          p.write_text(s)
          PY
            python -m pip install --disable-pip-version-check /tmp/ore_algebra
          } >> "$GITHUB_WORKSPACE/semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt" 2>&1
          RC=$?
          cd "$GITHUB_WORKSPACE"
          echo "R17_ORE_SYMBOLIC_INSTALL_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          python - <<'PY' >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt 2>&1
          from sage.all import QQ, PolynomialRing
          from ore_algebra import OreAlgebra
          print('R17_IMPORT_SMOKE_PASS',QQ(1)/3,PolynomialRing(QQ,'x'),OreAlgebra)
          PY
          exit $RC
      - name: Build exact branch annihilator
        if: always()
        run: |
          set +e
          timeout 1200 python semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.py >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt 2>&1
          RC=$?
          echo "R17_BRANCH_ANNIHILATOR_EXIT_CODE=$RC" >> semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          tail -200 semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          exit 0
      - name: Commit result safely on continuation branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic_v2/40_execution/combined/20260819__NZSCCM__Z1__R17_SPECTRAL_BRANCH_ORE_ANNIHILATOR_PROBE.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record resumed exact R17 smooth spectral branch annihilator'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi